<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>국내 주소·코드 연계 도구</title>
<style>
:root{font:14px/1.6 system-ui,sans-serif;color:var(--color-text-primary,#16202a);background:var(--color-background-primary,#fff)}*{box-sizing:border-box}body{margin:0}main{padding:16px;display:grid;gap:16px;max-width:900px;margin:auto}h1{font-size:20px;margin:0}p{margin:0}.muted{color:var(--color-text-secondary,#52606e);font-size:13px}.error{color:#b42318}label{display:grid;gap:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}textarea,select,input,button{font:inherit;color:inherit}textarea,select,input{width:100%;min-width:0;padding:9px;border:1px solid #aab7c3;border-radius:8px;background:var(--color-background-primary,#fff)}textarea{min-height:44px;max-height:14em;field-sizing:content;resize:vertical}#fields{display:grid;gap:14px}button{padding:8px 14px;background:var(--color-background-secondary,#f4f7f9);border:1px solid #aab7c3;border-radius:8px;cursor:pointer}#run{background:#1d5bd6;color:white;border-color:#1d5bd6;font-weight:600}button:disabled{opacity:.5;cursor:default}.result{padding:14px;border:1px solid #c8d1d9;border-radius:8px;margin-bottom:12px;overflow-wrap:anywhere}.result h2{font-size:14px;margin:0 0 10px}.result dl{margin:0;display:grid;gap:12px}.result dl>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}.result dt{font-weight:600}.result dd{margin:0;white-space:pre-wrap;min-width:0}.result select{margin-top:6px}.codes{display:block;font-size:12px;color:var(--color-text-secondary,#52606e);margin-top:5px}:focus-visible{outline:3px solid #2d6cdf;outline-offset:2px}#location-input{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}#location-input label:first-child,#location-input p{grid-column:1/-1}[hidden]{display:none!important}@media(max-width:480px){.result dl>div{grid-template-columns:1fr;gap:2px}}
</style></head>
<body><main>
<h1>주소·코드·위치 변환</h1>
<p class="muted">입력하면 주소·우편번호·PNU·법정동·행정동·위치를 한 번에 확인합니다.</p>
<div id="fields">
<label id="text-label">주소·PNU·법정동·행정동 코드·우편번호<textarea id="text" spellcheck="false" aria-label="주소·코드 입력" placeholder="주소, PNU, 법정동·행정동 코드, 우편번호"></textarea></label>
<div id="location-input" hidden><label>입력 좌표계<select id="source-crs" aria-label="입력 좌표계"></select></label><label>X (경도·동쪽값)<input id="x" inputmode="decimal" aria-label="X (경도·동쪽값)"></label><label>Y (위도·북쪽값)<input id="y" inputmode="decimal" aria-label="Y (위도·북쪽값)"></label><p class="muted">X는 경도·동쪽값, Y는 위도·북쪽값입니다.</p></div>
<p id="input-hint" class="muted">종류는 자동으로 알아봅니다. 주소를 정확히 모르면 주소 검색으로 웹에서 찾으세요. 여러 개는 Shift+Enter로 줄을 나눠 최대 20개까지 넣으세요.</p>
</div>
<div class="actions"><button id="run" disabled>검색</button><button id="search" type="button">주소 검색</button><button id="mode" type="button">좌표로 찾기</button><button id="copy" hidden>결과 복사</button><button id="web">웹에서 열기</button></div>
<p id="state" role="status" aria-live="polite"></p><p id="error" class="error" role="alert"></p>
<div id="preview"></div>
<div><button id="reference-link" type="button">기준 자료</button><p id="reference" class="muted">기준 자료를 확인하고 있습니다.</p></div>
<p id="host" class="muted" role="status">호스트 연결 중…</p>
</main>
<script type="module">__MCP_APPS_SDK__</script>
<script type="module">
const origin=__LINK_ORIGIN__;
const $=id=>document.getElementById(id),app=new globalThis.McpApps.App({name:'geo-link',version:'1.0.0'},{});
let mode='search',hostCaps={},busy=false,conversionSelections={},currentRows=[],generation=0,projections={};
const fields=[['address','주소'],['road_address','도로명주소'],['postcode','우편번호'],['pnu','PNU'],['legal_region','법정동코드'],['administrative_region','행정동코드'],['location','위치'],['parcel','필지'],['building','건물'],['land','토지 속성']];
// 필지 단위 결과(도로명주소·필지·건물·토지 속성)는 PNU가 정해지고 위치 조회를 켠 줄에만 있다
const detailKeys=['road_address','parcel','building','land'];
// 복사(TSV)는 기존 열 순서를 지키고 필지 단위 결과는 맨 뒤에
const baseFields=fields.filter(([key])=>!detailKeys.includes(key)),extraFields=fields.filter(([key])=>detailKeys.includes(key));
const detected={pnu:'PNU',code:'법정동코드',administrative:'행정동코드',address:'주소',location:'좌표',postcode:'우편번호'};
const coordinateSystems=['EPSG:4326','EPSG:3857','EPSG:5179','EPSG:5186','EPSG:5181'];
$('source-crs').replaceChildren(...coordinateSystems.map(crs=>new Option(crs,crs)));
const inputText=()=>mode==='location'?`${$('x').value.trim()}, ${$('y').value.trim()}`:$('text').value;
const hasInput=()=>mode==='location'?$('x').value.trim()&&$('y').value.trim():$('text').value.trim();
const showError=e=>{$('error').textContent=e?.message||String(e)};
const node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
async function call(name,args){const r=await app.callServerTool({name,arguments:args});if(r.isError)throw new Error(r.structuredContent?.error?.message||r.content?.find(c=>c.type==='text')?.text||'도구 호출 실패');return r}
function setBusy(value){busy=value;$('run').disabled=value||!hostCaps.serverTools||!hasInput();$('run').textContent=value?'검색 중…':'검색';for(const id of ['text','source-crs','x','y','mode'])$(id).disabled=value;for(const select of document.querySelectorAll('#preview select'))select.disabled=value||!!projections[select.dataset.locationCrs]?.busy}
function clearResults(){generation++;$('preview').replaceChildren();$('state').textContent='';$('error').textContent='';$('copy').hidden=true;$('copy').disabled=false;currentRows=[];conversionSelections={};projections={}}
function setMode(next){mode=next;const location=mode==='location';$('mode').textContent=location?'주소·코드로 찾기':'좌표로 찾기';$('search').hidden=location;$('text-label').hidden=location;$('input-hint').hidden=location;$('location-input').hidden=!location;clearResults();setBusy(false)}
function conversion(row,key){return row.conversions?.[key]}
function display(row,key){const selected=key==='location'&&projections[row.id];if(selected)return selected.busy?'좌표 변환 중…':selected.error||selected.value;const c=conversion(row,key);return c?.value||c?.errors?.map(e=>e.message).join(' / ')||'이 작업에서 조회하지 않았습니다.'}
async function project(row,target,select,coordinates,stamp,issue){const current=generation,request=(projections[row.id]?.request||0)+1;projections[row.id]={crs:target,value:'',error:'',busy:true,request};select.disabled=true;coordinates.textContent='좌표 변환 중…';stamp.textContent=target;issue.textContent='';$('copy').disabled=true;try{let value=conversion(row,'location').value;if(target!==row.output.crs){const result=await call('geo_link_resolve',{text:row.output.x+', '+row.output.y,options:{inputType:'location',target:'location',sourceCrs:row.output.crs,outputCrs:target}}),batch=result._meta?.linkResult||result.structuredContent,item=batch.rows?.[0];if(item?.status!=='ok')throw new Error(item?.errors?.map(error=>error.message).join(' / ')||'좌표를 변환하지 못했습니다.');value=item.output.code}if(current!==generation||projections[row.id]?.request!==request)return;projections[row.id].value=value;coordinates.textContent=value}catch(e){if(current!==generation||projections[row.id]?.request!==request)return;projections[row.id].error=e?.message||'좌표를 변환하지 못했습니다.';coordinates.textContent='';issue.textContent=projections[row.id].error}finally{if(select.isConnected&&projections[row.id]?.request===request){if(current!==generation){delete projections[row.id];select.value=row.output.crs;coordinates.textContent=conversion(row,'location').value;stamp.textContent=row.output.crs;issue.textContent=''}else projections[row.id].busy=false;select.disabled=busy;$('copy').disabled=Object.values(projections).some(value=>value.busy)}}}
async function download(row,button){const code=conversion(row,'legal_region')?.code;if(!code||button.disabled)return;const current=generation;$('error').textContent='';if(!hostCaps.downloadFile){$('state').textContent=`호스트의 파일 다운로드가 미지원입니다. 브라우저에서 ${origin}/link 를 여세요.`;return}button.disabled=true;button.textContent='SHP 준비 중…';try{const file=await call('geo_link_boundary',{codes:[code],crs:'EPSG:4326'});if(current!==generation)return;if(!file._meta?.resource)throw new Error('경계 파일 응답을 확인할 수 없습니다.');const result=await app.downloadFile({contents:[file._meta.resource]});if(current!==generation)return;if(result.isError)throw new Error('호스트가 파일 다운로드를 거절했습니다.');$('state').textContent='법정동 경계 SHP 다운로드를 요청했습니다.'}catch(e){if(current===generation)showError(e)}finally{button.disabled=false;button.textContent='SHP 다운로드'}}
function table(batch){
 currentRows=batch.rows||[];projections={};$('copy').disabled=false;$('preview').replaceChildren();
 for(const row of currentRows){const section=node('section');section.className='result';section.dataset.inputId=row.inputId;section.append(node('h2',row.original?.주소||row.value||'(빈 값)'));if(batch.options?.inputType==='auto'&&row.value?.trim()&&detected[row.inputType]){const kind=node('p',`${detected[row.inputType]}로 인식`);kind.className='muted detected';section.append(kind)}const list=node('dl');
  for(const [key,label]of fields){if(detailKeys.includes(key)&&!row.conversions?.[key])continue;const group=node('div'),value=node('dd'),coordinates=node('span',display(row,key)),c=conversion(row,key);if(key==='location')coordinates.className='location-value';value.append(coordinates);group.dataset.result=key;group.append(node('dt',label),value);
   if(key==='legal_region'&&c?.status==='ok'){const levels=['sido','sigungu','eupmyeondong','ri'].map((level,i)=>row.output?.[level+'_code']?`${['시도','시군구','읍면동','리'][i]} ${row.output[level+'_code']}`:'').filter(Boolean).join(' · ');if(levels){const line=node('span',levels);line.className='codes';value.append(line)}}
   if(key==='location'&&c?.status==='ok'){const stamp=node('p',row.output?.crs||''),control=node('label','위치 결과 좌표계'),select=node('select'),issue=node('p');select.setAttribute('aria-label',`${row.inputId} 위치 결과 좌표계`);select.dataset.locationCrs=row.id;select.append(...coordinateSystems.map(crs=>new Option(crs,crs)));select.value=row.output.crs;issue.className='error';issue.setAttribute('role','alert');select.onchange=()=>project(row,select.value,select,coordinates,stamp,issue);control.append(select);value.append(stamp,control,issue);const method=row.output?.location_method;if(method==='region_representative'||method==='address_point'){const note=node('p',method==='region_representative'?'구역 명칭으로 조회한 대표 위치입니다. 구역 중심점·개별 필지 좌표가 아닙니다.':'원천의 주소 대표점입니다. 필지 중심점은 아닙니다.');note.className='muted';value.append(note)}}
   if(c?.candidates?.length){const select=node('select');select.setAttribute('aria-label',`${row.inputId} ${label} 후보`);select.append(new Option('후보를 선택하세요',''));for(const candidate of c.candidates)select.append(new Option(`${candidate.name} · ${candidate.code}`,candidate.id));select.value=conversionSelections[key]?.[row.inputId]||'';select.onchange=()=>{if(select.value){conversionSelections[key]={...conversionSelections[key],[row.inputId]:select.value};run()}};value.append(select)}list.append(group)
  }section.append(list);const button=node('button','SHP 다운로드');button.type='button';button.setAttribute('aria-label',`${row.inputId} 법정동 경계 SHP 다운로드`);button.disabled=conversion(row,'legal_region')?.status!=='ok'||!conversion(row,'legal_region')?.code;button.onclick=()=>download(row,button);section.append(button);$('preview').append(section)
 }
 $('copy').hidden=!currentRows.length;$('reference').textContent=`${batch.reference?.source||'법정구역 사전'} · ${batch.version}`;$('state').textContent=batch.summary?.total>currentRows.length?`전체 ${batch.summary.total}개 중 ${currentRows.length}개 미리보기입니다. 전체 결과는 웹에서 확인하세요.`:`${currentRows.length}개 검색 결과`;
}
async function run(){if(busy||!hasInput())return;const text=inputText();if(text.includes('\t')){showError('한 줄에 값 하나씩 입력해 주세요. 표나 파일 붙여넣기는 현재 지원하지 않습니다.');return}if(text.replace(/\r?\n$/,'').split(/\r?\n/).length>20){showError('한 번에 20개까지 입력하세요.');return}setBusy(true);$('error').textContent='';const current=++generation;try{const r=await call('geo_link_resolve',{text,options:{inputType:mode==='location'?'location':'auto',target:'all',sourceCrs:$('source-crs').value,outputCrs:'EPSG:4326',conversionSelections}});if(current===generation)table(r._meta?.linkResult||r.structuredContent)}catch(e){if(current===generation)showError(e)}finally{if(current===generation)setBusy(false)}}
$('mode').onclick=()=>setMode(mode==='location'?'search':'location');
// Enter는 검색, Shift+Enter는 줄바꿈. 한글 조합 중 Enter는 무시한다.
$('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();run()}};
for(const id of ['text','x','y'])$(id).oninput=()=>{clearResults();setBusy(false)};$('source-crs').onchange=clearResults;$('run').onclick=run;
$('copy').onclick=async()=>{try{const clean=value=>{const text=String(value).replaceAll('\t',' ').replaceAll('\r',' ').replaceAll('\n',' ');return/^[\s\u0000-\u001f]*[=+\-@]/.test(text)?`'${text}`:text};await navigator.clipboard.writeText([['입력',...baseFields.map(([,name])=>name),'좌표계','시도코드','시군구코드','읍면동코드','리코드',...extraFields.map(([,name])=>name)],...currentRows.map(row=>[row.original?.주소||row.value,...baseFields.map(([key])=>display(row,key)),projections[row.id]?.crs||row.output?.crs||'',...['sido','sigungu','eupmyeondong','ri'].map(level=>row.output?.[level+'_code']||''),...extraFields.map(([key])=>display(row,key))])].map(line=>line.map(clean).join('\t')).join('\n'));$('state').textContent='결과를 복사했습니다.'}catch{showError('복사할 수 없습니다. 결과를 직접 선택해 복사하세요.')}};
async function open(path){if(!hostCaps.openLinks){$('state').textContent=`호스트의 웹 열기가 미지원입니다. 브라우저에서 ${origin}${path} 를 여세요.`;return}try{const r=await app.openLink({url:`${origin}${path}`});if(r.isError)throw new Error('호스트가 웹 열기를 거절했습니다.')}catch(e){showError(e)}}
$('web').onclick=()=>open('/link');$('reference-link').onclick=()=>open('/link/reference');$('search').onclick=()=>{const q=$('text').value.trim();open('/link?search=1'+(q&&!q.includes('\n')?'&q='+encodeURIComponent(q):''))};
app.ontoolresult=r=>{const batch=r._meta?.linkResult||r.structuredContent;if(!batch?.rows)return;const type=batch.options?.inputType;setMode(type==='location'?'location':'search');$('text').value=type==='location'?'':batch.rows.map(row=>row.value).join('\n');if(type==='location'){const xy=batch.rows[0]?.value.trim().split(/[\s,]+/);$('x').value=xy?.[0]||'';$('y').value=xy?.[1]||''}$('source-crs').value=batch.options?.sourceCrs||'EPSG:4326';conversionSelections=batch.options?.conversionSelections||{};table(batch);setBusy(false)};
try{await app.connect();hostCaps=app.getHostCapabilities()||{};$('host').textContent=hostCaps.serverTools?'':'호스트 도구 호출이 미지원입니다. 브라우저의 /link를 이용하세요.';setBusy(false);if(hostCaps.serverTools){const r=await call('geo_link_capabilities',{}),ref=r.structuredContent.reference;$('reference').textContent=ref.available?`${ref.source} · ${ref.version}`:'기준 자료가 준비되지 않았습니다.'}}catch(e){showError(e);$('host').textContent=`앱 연결 실패. 브라우저에서 ${origin}/link 를 이용하세요.`}
</script></body></html>
