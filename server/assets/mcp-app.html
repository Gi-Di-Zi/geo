<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>공간 데이터 시각화 도구 · MCP Apps 베타</title>
<!--
  MCP App (server/routes/mcp.ts의 ui://geo/app.html). 대화 안에서:
  ① 대상 라이브러리·목적·제공 방식(AI가 geo_identify에 넘긴 값으로 미리 선택) → ② 업로드·판별 → ③ 서버 추천(geo_recommend) → ④ 고급 설정에서 방식 변경
  → ⑤ 변환(geo_convert, 화면에서 고른 조건 그대로) → ⑥ 진행(geo_status) → ⑦ 대상 뷰어용 결과(파일: 내려받기·리소스 URL·적용 코드 / 서비스: 48시간 만료 상태).
  화면에서 사용자가 조건을 바꾸면 그 뒤로는 AI 쪽 값(도구 입력·결과)으로 덮지 않는다. 추천 응답은 마지막 요청 것만 쓴다.
  __ORIGIN__ = 이 사이트 주소 (서버가 채움). 파일은 /api/stage로 바로, 막히면 geo_stage_chunk 도구로 조각조각.
  첫 script = MCP Apps SDK(app-with-deps.js)를 서버가 통째로 넣는 자리 → 외부 스크립트 없이 뜬다 (사내망·CDN 장애)
-->
<style>
  :root {
    --ink: #16202A; --ink-2: #52606E; --rule: #D7DFE6; --surface: #FFFFFF; --soft: #F4F7F9;
    --link: #1D5BD6; --c: #1D5BD6; --bad: #B42318; --warn: #8A5300; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E6EDF3; --ink-2: #9AA7B4; --rule: #334150; --surface: #1B2430; --soft: #141C25; --link: #7AA7FF; --bad: #F97066; --warn: #F2C14E; --ok: #47CD89; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background: transparent; }
  main { padding: 14px 16px; display: grid; gap: 10px; }
  .beta-note { padding: 10px 16px; border-bottom: 1px solid var(--rule); color: var(--ink-2); font-size: 12.5px; }
  h2 { font-size: 15px; margin: 0; }
  h3 { font-size: 13px; margin: 6px 0 0; color: var(--ink-2); }
  p, ul { margin: 0; }
  ul { padding-left: 1.1em; }
  .muted { color: var(--ink-2); }
  .small { font-size: 12.5px; }
  .err { color: var(--bad); }
  .warn { color: var(--warn); }
  .ok { color: var(--ok); }
  .drop { display: grid; justify-items: center; gap: 2px; padding: 22px 12px; text-align: center; cursor: pointer; border: 1.5px dashed var(--rule); border-radius: 12px; background: var(--surface); }
  .drop:hover, .drop.over { border-color: var(--link); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .card { display: grid; gap: 3px; align-content: start; text-align: left; font: inherit; color: inherit; padding: 9px 11px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  button.card { cursor: pointer; }
  button.card:disabled { cursor: default; opacity: 0.55; }
  .card.on, .card[aria-checked='true'] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .card[aria-checked='true'] strong::after { content: ' ✓'; color: var(--c); }
  .tag { font-size: 11.5px; color: var(--ink-2); }
  .best { color: var(--c); font-weight: 700; }
  .pills { display: flex; flex-wrap: wrap; gap: 3px; }
  .pills span { font-size: 11.5px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--rule); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
  .seg button[aria-checked='true'] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .seg button .x { font-size: 11px; opacity: 0.75; }
  .field { display: grid; gap: 3px; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .badge { font-size: 11.5px; font-weight: 700; padding: 0 7px; border-radius: 99px; border: 1px solid currentColor; }
  .badge.recommended, .badge.active { color: var(--ok); }
  .badge.limited, .badge.alternative, .badge.deleting { color: var(--warn); }
  .badge.unsupported, .badge.expired, .badge.deleted, .badge.failed { color: var(--bad); }
  .rec { display: grid; gap: 6px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--c); border-radius: 10px; }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .btn { font: inherit; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 5px 12px; cursor: pointer; }
  .btn.go { background: var(--c); border-color: var(--c); color: #fff; font-weight: 600; padding: 7px 18px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--c); transition: width 0.4s; }
  .now::before { content: '● '; color: var(--c); animation: blink 1s infinite; }
  input[type='text'], select { font: 12.5px ui-monospace, monospace; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); }
  input[type='text'] { width: 13rem; }
  iframe { width: 100%; height: 440px; border: 1px solid var(--rule); border-radius: 10px; background: var(--soft); }
  a { color: var(--link); word-break: break-all; }
  .out { display: grid; gap: 5px; padding: 9px 11px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .out.main { border-color: var(--c); }
  .out code { flex: 1 1 14rem; min-width: 0; font: 12px ui-monospace, monospace; color: var(--ink-2); word-break: break-all; }
  .out.gone code { text-decoration: line-through; }
  pre { margin: 0; padding: 8px 10px; overflow-x: auto; font: 11.5px/1.5 ui-monospace, monospace; background: var(--soft); border-radius: 8px; }
  .btn.sm { font-size: 12.5px; padding: 3px 10px; }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>
<header class="beta-note"><strong>MCP Apps · 베타</strong><p>대화 안 화면과 내려받기는 호스트에 따라 다릅니다. 연결이 원활하지 않으면 <a id="web-upload" href="__ORIGIN__/viz/upload" target="_blank" rel="noopener noreferrer">웹 업로드</a>를 이용하세요.</p></header>
<main id="root"><p class="muted small">불러오는 중…</p></main>
<script type="module">__MCP_APPS_SDK__</script>
<script type="module">
  // SDK는 바로 위 스크립트(서버가 넣음)가 globalThis.McpApps로 내놓는다. 모듈 스크립트는 문서 순서대로 돈다
  const { App } = globalThis.McpApps

  const ORIGIN = '__ORIGIN__'
  const SRS_LIST = [
    ['EPSG:5186', '중부원점 (GRS80, 원점 북 600km) — 2010년 이후 국가 표준'],
    ['EPSG:5185', '서부원점 (GRS80)'], ['EPSG:5187', '동부원점 (GRS80)'], ['EPSG:5188', '동해원점 (GRS80)'],
    ['EPSG:5181', '중부원점 (GRS80, 원점 북 500km) — 카카오 지도 등'],
    ['EPSG:5179', 'UTM-K (GRS80) — 도로명주소·네이버 지도 등'],
    ['EPSG:5174', '보정 중부원점 (Bessel) — 옛 지적·인허가 자료'],
    ['EPSG:2097', '중부원점 (Bessel) — 옛 자료'], ['EPSG:4326', '위경도 (WGS84)'],
  ]
  // 도구 인자 값 ↔ 표시 이름 (server/routes/mcp.ts intentArgs, shared/recommend.ts와 같은 id)
  const VIEWERS = [['auto', '자동 추천'], ['ol', 'OpenLayers'], ['maplibre', 'MapLibre GL JS'], ['deck', 'Deck.gl'], ['cesium', 'CesiumJS']]
  const PRIORITIES = [['balanced', '일반적인 사용'], ['fast_preview', '빠른 미리보기'], ['large_data', '대용량 웹 표출'], ['fidelity', '원본 정보 최대한 보존']]
  /** 파일 방식의 최종본 형태 (shared/recommend.ts forms) */
  const FORMS = [['files', '결과 파일 + 적용 코드'], ['html', '바로 열리는 HTML 지도']]
  const KINDS = { auto: '자동', geojson: 'GeoJSON', mvt: 'MVT 벡터타일', pmtiles: 'PMTiles', image: '단일 이미지', cog: 'COG', 'xyz-raster': 'XYZ 래스터 타일', 'terrain-rgb': 'Terrain-RGB', 'quantized-mesh': 'Quantized-mesh', '3dtiles': '3D Tiles', glb: 'glTF (GLB)', wms: 'WMS' }
  const FIT = { recommended: '추천', alternative: '대안', limited: '제약 있음', unsupported: '미지원' }
  const STATE = { active: '이용 가능', expired: '만료', deleting: '정리 중', deleted: '정리 완료', failed: '실패' }
  const root = document.getElementById('root')
  const app = new App({ name: 'geo-web-bridge', version: '1.1.0' })
  const nameOf = v => VIEWERS.find(x => x[0] === v)?.[1] ?? v

  /** 조건: 대상 라이브러리·목적·결과 형식·제공 방식. touched = 사용자가 화면에서 바꿈 → AI 쪽 값으로 다시 덮지 않음 */
  let intent = { viewer: 'auto', priority: 'balanced', outputKind: 'auto', delivery: 'file', form: 'files' }
  let touched = false
  let service = { enabled: false, hours: 48, deliveries: [] }
  /** 판별 결과, 고른 형식, 서버 추천, 고른 방식(picked = 사용자가 고급 설정에서 직접), 좌표계, 추천 요청 번호 */
  let found = null, fmt = null, rec = null, method = null, picked = false, srs = '', seq = 0, advanced = false, timer = null

  // 작은 DOM 도우미 (파일 이름 등은 textContent로만 넣는다)
  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else if (v === true) el.setAttribute(k, '')
      else if (v !== false && v != null) el.setAttribute(k, v)
    }
    el.append(...kids.flat(Infinity).filter(x => x != null && x !== false))
    return el
  }
  const render = (...els) => { clearTimeout(timer); root.replaceChildren(...els.flat().filter(Boolean)) }
  const mb = n => (n < 1048576 ? Math.round(n / 1024) + 'KB' : (n / 1048576).toFixed(1) + 'MB')
  /** 버튼 글자를 잠깐 바꿔 결과 알리기 */
  function flash(btn, text, ms = 1500) {
    btn.dataset.label ??= btn.textContent
    btn.textContent = text
    clearTimeout(btn.flashTimer)
    btn.flashTimer = setTimeout(() => { btn.textContent = btn.dataset.label }, ms)
  }
  /** 주소 복사. 호스트가 클립보드 권한을 안 주면 예전 방식(execCommand)으로 */
  async function copy(text) {
    if (await (navigator.clipboard?.writeText(text).then(() => true, () => false) ?? false)) return true
    const t = h('textarea', {}, text)
    document.body.append(t); t.select()
    const ok = document.execCommand('copy')
    t.remove()
    return ok
  }
  const copyBtn = (text, value, disabled) => h('button', { class: 'btn sm', type: 'button', disabled: !!disabled, onclick: async e => { const b = e.currentTarget; flash(b, (await copy(value)) ? '복사됨 ✓' : '복사 막힘 — 직접 선택') } }, text)
  /** 링크 열기. 호스트가 막으면(Claude는 https 주소만 연다) 주소를 복사해 두고 알린다 */
  async function open(url, btn) {
    const r = await app.openLink({ url }).catch(() => ({ isError: true }))
    if (r?.isError) flash(btn, (await copy(url)) ? '열기 막힘 → 주소 복사됨, 브라우저에 붙여넣기' : '열기 막힘 — 주소를 직접 복사', 4000)
  }
  const linkBtn = (text, url, disabled) => h('button', { class: 'btn', type: 'button', disabled: !!disabled, onclick: e => open(url, e.currentTarget) }, text)
  document.getElementById('web-upload').addEventListener('click', e => { e.preventDefault(); open(webUpload(), e.currentTarget) })
  /** 웹 업로드 주소: 지금 조건을 그대로 넘긴다 */
  function webUpload() {
    const q = new URLSearchParams(Object.entries(intent).filter(([k, v]) => !(v === 'auto' || (k === 'priority' && v === 'balanced') || (k === 'delivery' && v === 'file') || (k === 'form' && v === 'files') || k === 'outputKind')))
    return `${ORIGIN}/viz/upload${q.size ? `?${q}` : ''}`
  }

  // ponytail: 화면이 받아 호스트에 통째로 넘기는 크기 상한. 넘으면 호스트가 직접 받게(resource_link) 맡긴다
  const INLINE_MAX = 100 * 1024 ** 2
  /** 받아서 base64. 상한을 넘으면 null */
  async function fetchB64(url) {
    const res = await fetch(url)
    if (!res.ok) throw new Error(`내려받기 실패 (${res.status})`)
    const reader = res.body.getReader(), parts = []
    for (let n = 0; ;) {
      const { done, value } = await reader.read()
      if (done) break
      if ((n += value.length) > INLINE_MAX) { reader.cancel(); return null }
      parts.push(value)
    }
    return b64(new Uint8Array(await new Blob(parts).arrayBuffer()))
  }
  /** 내려받기. 대화 화면은 직접 저장이 막혀 있어 호스트에 넘긴다(downloadFile). 못 하면 링크 열기 → 그것도 막히면 주소 복사 */
  async function download(o, btn) {
    if (app.getHostCapabilities()?.downloadFile) {
      flash(btn, '받는 중…', 600000)
      const mimeType = o.zip ? 'application/zip' : 'application/octet-stream'
      const r = await fetchB64(o.download)
        .then(blob => app.downloadFile({ contents: [blob ? { type: 'resource', resource: { uri: `file:///${o.file}`, mimeType, blob } } : { type: 'resource_link', uri: o.download, name: o.file, mimeType }] }))
        .catch(() => ({ isError: true }))
      if (!r?.isError) return flash(btn, '저장 창으로 넘김 ✓', 3000)
    }
    return open(o.download, btn)
  }
  /** 모델에게 알리기 (다음 대화 턴에 전달됨, 응답을 바로 만들지는 않음) */
  const tell = text => app.updateModelContext({ content: [{ type: 'text', text }] }).catch(() => {})
  async function tool(name, args) {
    const r = await app.callServerTool({ name, arguments: args })
    if (r.isError) throw new Error(r.content?.[0]?.text ?? '도구 오류')
    return r.structuredContent
  }

  /** AI가 보낸 조건(도구 입력·결과). 사용자가 화면에서 이미 바꿨으면 무시 */
  function applyIntent(src) {
    if (touched || !src) return
    const pick = (v, list, fallback) => (list.some(x => x[0] === v) ? v : fallback)
    intent = {
      viewer: pick(src.viewer, VIEWERS, 'auto'),
      priority: pick(src.priority, PRIORITIES, 'balanced'),
      outputKind: src.outputKind in KINDS && src.outputKind !== 'wms' ? src.outputKind : 'auto',
      delivery: src.delivery === 'service' ? 'service' : 'file',
      form: src.form === 'html' ? 'html' : 'files',
    }
  }
  const intentLine = () => `대상 ${nameOf(intent.viewer)} · 목적 ${PRIORITIES.find(p => p[0] === intent.priority)[1]}${intent.outputKind !== 'auto' ? ` · 결과 형식 ${KINDS[intent.outputKind]}` : ''} · 제공 ${intent.delivery === 'service' ? `서비스(${service.hours}시간 임시)` : intent.form === 'html' ? '파일 · 독립 HTML 지도' : '파일'}`

  /** 라디오 묶음 (작은 알약). mark(v) = 옆에 붙일 짧은 표시(예: 미지원) */
  function seg(label, list, value, onPick, mark = () => null) {
    return h('div', { class: 'field' }, h('span', {}, label),
      h('div', { class: 'seg', role: 'radiogroup', 'aria-label': label }, list.map(([v, text]) =>
        h('button', { type: 'button', role: 'radio', 'aria-checked': String(v === value), onclick: () => onPick(v) }, text, mark(v) && h('span', { class: 'x' }, ` · ${mark(v)}`)))))
  }

  /** 조건 고르기. 바꾸면 touched → change() (판별 뒤에는 서버 추천 다시) */
  function intentControls(change) {
    const set = (k, v) => {
      if (intent[k] === v) return
      touched = true
      intent = { ...intent, [k]: v }
      tell(`사용자가 화면에서 조건 변경: ${intentLine()}`)
      change()
    }
    const ways = service.deliveries?.length ? service.deliveries : [
      { id: 'file', title: '실제 웹 프로젝트에서 사용할 수 있는 공간데이터 파일 생성', text: '변환된 결과 파일을 다운로드하고 자신의 웹 서버 또는 애플리케이션에서 사용할 수 있습니다.' },
      { id: 'service', title: '48시간 임시 공간 서비스 — 실제 조회·연동 테스트', text: 'WMS·WFS 등 공간 서비스의 실제 응답과 웹 지도 연동을 확인하는 용도입니다. 발행 완료 후 48시간이 지나면 자동 만료됩니다.' },
    ]
    const byViewer = rec?.byViewer
    const kinds = rec ? ['auto', ...new Set(rec.candidates.flatMap(c => [c.primary, ...c.extras].filter(Boolean).map(o => o.kind)))] : Object.keys(KINDS).filter(k => k !== 'wms')
    return [
      seg('대상 웹 지도 라이브러리', VIEWERS, intent.viewer, v => set('viewer', v), v => (byViewer && v !== 'auto' && !byViewer.find(b => b.viewer === v)?.method ? '미지원' : null)),
      seg('목적', PRIORITIES, intent.priority, v => set('priority', v)),
      h('div', { class: 'field' }, h('span', {}, '제공 방식'),
        h('div', { class: 'cards', role: 'radiogroup', 'aria-label': '제공 방식' }, ways.map(w =>
          h('button', { class: 'card', type: 'button', role: 'radio', 'aria-checked': String(w.id === intent.delivery), onclick: () => set('delivery', w.id) },
            h('strong', {}, w.title),
            h('span', { class: 'small muted' }, w.text),
            w.id === 'service' && !service.enabled && h('span', { class: 'small err' }, '이 서버는 서비스 발행 미제공 (파일만)'))))),
      intent.delivery === 'file' && seg('최종본 형태', FORMS, intent.form, v => set('form', v)),
      h('label', { class: 'field' }, h('span', {}, '결과 형식'),
        h('select', { 'aria-label': '결과 형식', onchange: e => set('outputKind', e.target.value) },
          kinds.map(k => h('option', { value: k, selected: k === intent.outputKind }, KINDS[k] ?? k)))),
    ]
  }

  // ① 조건 + 업로드
  function uploadView(msg) {
    const input = h('input', { type: 'file', hidden: true, onchange: e => upload(e.target.files[0]) })
    const zone = h('label', { class: 'drop' }, input,
      h('strong', {}, '파일 끌어 놓기 또는 고르기'),
      h('span', { class: 'small muted' }, 'SHP는 zip으로(폴더째 가능), 타일셋은 zip 하나로. 최대 200MB · 한 번에 한 변환'))
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over') })
    zone.addEventListener('dragleave', () => zone.classList.remove('over'))
    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); upload(e.dataTransfer.files[0]) })
    rec = null
    render(h('h2', {}, '공간 데이터 올리기'), intentControls(() => uploadView(msg)), zone, msg && h('p', { class: 'small err' }, msg))
  }

  async function upload(file) {
    if (!file) return
    const bar = h('span', { style: 'width:0%' })
    const note = h('p', { class: 'small muted' }, `${file.name} · ${mb(file.size)} 올리는 중…`)
    render(h('h2', {}, '공간 데이터 올리기'), note, h('div', { class: 'bar' }, bar))
    const progress = p => { bar.style.width = `${Math.round(p * 100)}%` }
    try {
      let r
      try { r = await direct(file, progress) } catch (e) {
        if (e.final) throw e
        // 대화 화면이 서버에 바로 못 보냄(브라우저 보안·네트워크) → 도구 호출로 조각조각
        note.textContent = `${file.name} · 직접 올리기 막힘 → 조각으로 올리는 중…`
        r = await chunks(file, progress)
      }
      chooseView(r)
      tell(`사용자가 업로드 화면에 ${r.name}을(를) 올림. 판별: ${r.formats[0] ? `${r.formats[0].id} (${r.formats[0].name})` : `받을 수 없음 — ${r.note}`}. stage=${r.stage}. 조건: ${intentLine()}`)
    } catch (e) { uploadView(e.message) }
  }

  /** 서버(/api/stage)로 바로. 네트워크·보안으로 막히면 일반 오류, 서버가 거절하면 final(조각으로 다시 보내지 않음) */
  const direct = (file, progress) => new Promise((ok, fail) => {
    const x = new XMLHttpRequest()
    x.open('POST', `${ORIGIN}/api/stage`)
    x.upload.onprogress = e => { if (e.lengthComputable) progress(e.loaded / e.total) }
    x.onload = () => {
      let j = {}
      try { j = JSON.parse(x.responseText) } catch {}
      if (x.status === 200) return ok(j)
      fail(Object.assign(new Error(j.statusMessage ?? j.message ?? `업로드 실패 (${x.status})`), { final: true }))
    }
    x.onerror = () => fail(new Error('network'))
    const body = new FormData()
    body.append('file', file)
    x.send(body)
  })

  const b64 = bytes => {
    let s = ''
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
    return btoa(s)
  }
  /** geo_stage_chunk 도구로 512KB씩 순서대로 */
  async function chunks(file, progress) {
    const size = 512 * 1024
    let upload
    for (let at = 0; ; at += size) {
      const last = at + size >= file.size
      const data = b64(new Uint8Array(await file.slice(at, at + size).arrayBuffer()))
      const r = await tool('geo_stage_chunk', { ...(upload && { upload }), name: file.name, data, last })
      upload = r.upload
      progress(Math.min(1, (at + size) / file.size))
      if (last) return r
    }
  }

  // ② 판별 ③ 추천 ④ 고급 설정
  function chooseView(r, prevSrs) {
    found = r
    fmt = r.formats[0] ?? null
    method = null
    picked = false
    srs = prevSrs ?? r.srs?.guess ?? ''
    // geo_identify(stage)가 같은 조건의 추천을 이미 준 경우는 그대로, 아니면 서버에 묻는다
    if (fmt && r.recommendation?.format === fmt.id && !touched) { rec = r.recommendation; method = rec.recommended?.method ?? null; drawChoose() }
    else recompute()
  }

  /** 서버 추천 다시 계산 (조건·형식이 바뀔 때). 늦게 온 앞 요청의 응답은 버린다 */
  function recompute() {
    if (!fmt) return drawChoose()
    const my = ++seq
    rec = null
    drawChoose()
    tool('geo_recommend', { stage: found.stage, format: fmt.id, ...intent }).then(r => {
      if (my !== seq) return
      rec = r
      const still = rec.candidates.find(c => c.method === method && c.fit !== 'unsupported')
      // 사용자가 고급 설정에서 고른 방식이 새 조건에도 맞으면 유지, 아니면 새 추천으로
      if (!picked || !still) { method = rec.recommended?.method ?? null; picked = false }
      drawChoose()
    }, e => { if (my === seq) { rec = { error: e.message }; drawChoose() } })
  }

  /** 같은 파일로 다시 고르기 (geo_identify에 작업 id → 그 작업의 원본). 좌표계는 지난번 값, 조건은 지금 화면 그대로 */
  const againBtn = (s, label = '다른 방식으로 다시', change) => h('button', { class: 'btn', type: 'button', onclick: async e => {
    const b = e.currentTarget
    b.disabled = true
    if (change) { touched = true; intent = { ...intent, ...change } }
    try { chooseView(await tool('geo_identify', { stage: s.job, ...intent }), s.srs) } catch (err) { b.disabled = false; flash(b, err.message, 4000) }
  } }, label)
  const newFileBtn = () => h('button', { class: 'btn', type: 'button', onclick: () => uploadView() }, '다른 파일 올리기')
  const list = (title, items, cls = '') => items?.length ? [h('h3', {}, title), h('ul', { class: `small ${cls}` }, items.map(t => h('li', {}, t)))] : null

  function drawChoose() {
    const r = found
    const head = [h('h2', {}, `${r.name} · ${mb(r.bytes)}`), h('p', { class: 'small muted' }, r.facts.join(' · ')), r.warns.map(w => h('p', { class: 'small warn' }, w))]
    if (!fmt) return render(...head, h('p', { class: 'err' }, r.note ?? '받을 수 없는 파일'), h('div', {}, newFileBtn()))
    document.documentElement.style.setProperty('--c', fmt.color ?? '#1D5BD6')
    const chosen = rec?.candidates?.find(c => c.method === method)
    const ready = () => !!(chosen && chosen.fit !== 'unsupported' && !rec.blocked && (!r.srs || /^EPSG:\d{4,6}$/.test(srs)) && !(intent.delivery === 'service' && !service.enabled))
    const start = h('button', { class: 'btn go', type: 'button', disabled: !ready(), onclick: () => convert(start, error) }, '변환 시작')
    const error = h('p', { class: 'small err' })

    const formats = r.formats.length > 1 && [h('h3', {}, `형식 — 후보 ${r.formats.length}개, 판별 결과가 맞는지 확인`), h('div', { class: 'cards', role: 'radiogroup', 'aria-label': '형식' }, r.formats.map(f =>
      h('button', { class: 'card', type: 'button', role: 'radio', 'aria-checked': String(f === fmt), onclick: () => { fmt = f; method = null; picked = false; recompute() } },
        h('span', { class: 'tag' }, `${f.category} · ${f.extensions[0]}`, f.best ? h('span', { class: 'best' }, ' · 판별 결과') : null),
        h('strong', {}, f.name),
        h('span', { class: 'small muted' }, f.summary))))]

    render(...head,
      formats,
      intentControls(recompute),
      recCard(chosen),
      advancedBox(),
      r.srs && h('div', { class: 'small' },
        h('strong', {}, '좌표계 선택 '), h('span', { class: 'muted' }, `— ${r.srs.why}`), h('br'),
        h('input', { type: 'text', list: 'srs-list', value: srs, placeholder: 'EPSG:5186', oninput: e => { srs = e.target.value.trim(); start.disabled = !ready() } }),
        h('datalist', { id: 'srs-list' }, SRS_LIST.map(([v, t]) => h('option', { value: v }, t))),
        h('span', { class: 'muted' }, ' 틀리면 엉뚱한 곳에 그려짐')),
      h('div', { class: 'row' }, start, h('button', { class: 'btn', type: 'button', onclick: () => uploadView() }, '다른 파일')),
      error)
  }

  /** 추천 카드: 방식 → 주력 결과물 → 이유 → 주의. 조건을 못 채우면 이유와 실제 가능한 대안 */
  function recCard(chosen) {
    if (!rec) return h('section', { class: 'rec', 'aria-label': '추천' }, h('p', { class: 'small now' }, '서버가 조건에 맞는 방식을 고르는 중…'))
    if (rec.error) return h('section', { class: 'rec', 'aria-label': '추천' }, h('p', { class: 'small err' }, rec.error))
    const best = rec.recommended
    const target = intent.viewer === 'auto' ? null : nameOf(intent.viewer)
    if (!best) {
      const alts = rec.byViewer.filter(b => b.method)
      return h('section', { class: 'rec', 'aria-label': '추천' },
        h('h3', {}, '추천 없음 — 조건을 채우는 방식이 없음'),
        h('p', { class: 'small err' }, rec.conflict ?? ''),
        intent.delivery === 'service' && !service.enabled && h('p', { class: 'small' }, '제공 방식을 파일로 바꾸면 아래 파일 결과를 받아 직접 호스팅하거나 자체 공간 서버에 올릴 수 있음'),
        intent.viewer !== 'auto' && alts.length && h('div', { class: 'row' }, h('span', { class: 'small muted' }, '지원 라이브러리:'),
          alts.map(b => h('button', { class: 'btn sm', type: 'button', onclick: () => { touched = true; intent = { ...intent, viewer: b.viewer }; tell(`사용자가 대상 라이브러리를 ${b.name}로 변경`); recompute() } }, `${b.name} → ${KINDS[b.output.kind]}`))))
    }
    const c = chosen ?? best
    return h('section', { class: 'rec', 'aria-label': '추천' },
      h('div', { class: 'row' }, h('h3', { style: 'margin:0' }, c === best ? '추천 변환 방식' : '선택한 변환 방식'), h('span', { class: `badge ${c.fit}` }, FIT[c.fit]), c !== best && h('span', { class: 'small muted' }, `추천은 ${best.title}`)),
      h('strong', {}, `${c.title} · ${c.way === 'service' ? `서비스 (${service.hours}시간 임시)` : '파일'}`),
      c.primary && h('p', {}, `${target ? `${target}에서 쓸 ` : ''}주력 결과물: `, h('strong', {}, KINDS[c.primary.kind] ?? c.primary.kind), ` (${c.primary.label})`, c.extras.length ? h('span', { class: 'small muted' }, ` · 함께: ${c.extras.map(e => KINDS[e.kind] ?? e.kind).join('·')}`) : null),
      !target && h('p', { class: 'small muted' }, `대상 라이브러리 미지정 — 뷰어별: ${rec.byViewer.map(b => `${b.name} ${b.output ? KINDS[b.output.kind] : '미지원'}`).join(' · ')}`),
      list('추천 이유', c.reasons),
      list('주의사항', [...c.warnings, ...rec.notes], 'warn'),
      rec.blocked && h('p', { class: 'small err' }, `변환 불가: ${rec.blocked}`),
      rec.needs.filter(n => !n.startsWith('(선택)')).length > 0 && list('필요한 입력', rec.needs.filter(n => !n.startsWith('(선택)'))))
  }

  /** 고급 설정: 모든 방식을 맞음 정도·도구·결과·장단점과 함께. 미지원은 이유만 보이고 고를 수 없음 */
  function advancedBox() {
    if (!rec?.candidates) return null
    const box = h('details', { open: advanced, ontoggle: e => { advanced = e.currentTarget.open } },
      h('summary', {}, `다른 방식 보기 (고급 설정) — ${rec.candidates.length}개`),
      h('div', { class: 'cards', role: 'radiogroup', 'aria-label': '변환 방식' }, rec.candidates.map(c =>
        h('button', { class: 'card', type: 'button', role: 'radio', 'aria-checked': String(c.method === method), disabled: c.fit === 'unsupported', onclick: () => {
          method = c.method; picked = true
          tell(`사용자가 고급 설정에서 방식 변경: ${c.title} (${c.method})${c.method !== rec.recommended?.method ? ' — 추천과 다른 방식' : ''}`)
          drawChoose()
        } },
          h('span', { class: 'row' }, h('span', { class: `badge ${c.fit}` }, FIT[c.fit]), h('span', { class: 'tag' }, `${c.method} · ${c.way === 'service' ? '서비스' : '파일'} · 단계 ${c.steps}`)),
          h('strong', {}, c.title),
          h('span', { class: 'pills' }, [c.primary, ...c.extras].filter(Boolean).map(o => h('span', {}, KINDS[o.kind] ?? o.kind))),
          h('span', { class: 'small muted' }, c.reasons[0] ?? ''),
          c.warnings[0] && h('span', { class: 'small warn' }, c.warnings[0]),
          (c.pros.length || c.cons.length) && h('span', { class: 'small' }, [...c.pros.map(t => `+ ${t}`), ...c.cons.map(t => `− ${t}`)].join(' / '))))))
    return box
  }

  async function convert(button, error) {
    button.disabled = true
    error.textContent = ''
    try {
      const s = await tool('geo_convert', { stage: found.stage, format: fmt.id, method, ...(found.srs && { srs }), ...intent })
      tell(`사용자가 화면에서 변환 시작: ${s.format} · ${s.method?.title} (작업 ${s.job}) · ${intentLine()}${picked && method !== rec?.recommended?.method ? ' · 추천과 다른 방식 직접 선택' : ''}. 진행·결과는 geo_status로 확인 가능.`)
      progressView(s)
    } catch (e) { error.textContent = e.message; button.disabled = false }
  }

  // ⑥ 진행 (1.5초마다 geo_status) ⑦ 결과
  function progressView(s) {
    if (s.state === 'done') return doneView(s)
    const { done, total, current } = s.progress
    const way = s.delivery === 'service' ? `서비스 (${service.hours}시간 임시)` : '파일'
    render(
      h('h2', {}, `${s.name} — ${s.state === 'failed' ? '변환 실패' : '변환 중'}`),
      h('p', { class: 'small muted' }, `${s.format} · ${way} · ${s.method?.title ?? ''}${s.intent?.viewer ? ` · 대상 ${nameOf(s.intent.viewer)}` : ''}`),
      h('div', { class: 'bar' }, h('span', { style: `width:${total ? Math.round(((done + (s.state === 'running' ? 0.4 : 0)) / total) * 100) : 0}%` })),
      s.state === 'failed'
        ? [h('p', { class: 'small err' }, s.error), h('div', { class: 'row' }, linkBtn('단계 로그 보기', s.view.replace('/view?', '/convert?')), againBtn(s), newFileBtn())]
        : h('p', { class: 'small now' }, `${done}/${total} 단계 — ${current ?? '준비 중'}`),
      s.state === 'running' && h('div', {}, linkBtn('진행 화면 크게 보기', s.view)))
    if (s.state === 'failed') tell(`변환 실패 (작업 ${s.job}): ${s.error}`)
    if (s.state === 'running') timer = setTimeout(() => tool('geo_status', { job: s.job }).then(progressView, e => render(h('p', { class: 'err' }, e.message))), 1500)
  }

  /** 결과 하나: 파일이면 내려받기 + 리소스 URL + 호스팅 조건 + 검사, 서비스면 서비스 URL (만료되면 줄 긋고 복사·열기 막음) */
  function outputBox(o, main) {
    const fields = o.check?.fields?.length ? ` · 속성 ${o.check.fields.slice(0, 10).join(', ')}` : ''
    return h('div', { class: `out${main ? ' main' : ''}${o.available ? '' : ' gone'}` },
      h('div', { class: 'row' }, h('strong', {}, o.label), h('span', { class: 'tag' }, `${o.kindLabel ?? o.kind}${o.layer ? ` · 레이어 ${o.layer}` : ''}${o.features ? ` · 피처 ${o.features}` : ''}${fields}`)),
      o.crs && h('span', { class: 'small muted' }, `좌표계: ${o.crs}${o.bounds ? ` · 범위 ${o.bounds.map(v => v.toFixed(4)).join(', ')}` : ''}`),
      o.download && h('div', { class: 'row' },
        h('button', { class: 'btn go sm', type: 'button', onclick: e => download(o, e.currentTarget) }, o.zip ? '내려받기 (zip)' : '내려받기'),
        copyBtn('내려받기 주소 복사', o.download)),
      h('div', { class: 'row' }, h('code', {}, o.url),
        copyBtn(o.service ? (o.available ? '서비스 URL 복사' : '만료 — 이용 불가') : '리소스 URL 복사', o.url, !o.available)),
      h('span', { class: 'small muted' }, o.service ? '공간 서버 서비스 URL (임시)' : '지도에서 참조할 리소스 URL — 이 서버의 사본. 내려받아 올린 곳 주소로 바꿔 사용'),
      o.hosting && h('span', { class: 'small muted' }, `직접 호스팅: ${o.hosting}`),
      o.check && h('span', { class: `small ${o.check.ok ? 'ok' : 'err'}` }, o.check.ok ? `파일 검사 통과 — ${o.check.checked.join(', ')} (${o.check.files}개 파일, ${mb(o.check.bytes)})` : `파일 검사 문제 — ${o.check.problems.join(', ')}`))
  }

  /** 서비스 상태: 발행·만료(현지 시각)·남은 시간. 1분마다 다시 세고, 만료되면 그 자리에서 이용 불가로 바꾼다 */
  function serviceBox(s) {
    const box = h('section', { class: 'out main', 'aria-label': '임시 공간 서비스' })
    const local = iso => (iso ? new Date(iso).toLocaleString() : '-')
    const draw = () => {
      const v = s.service
      const left = v.expiresAt ? Date.parse(v.expiresAt) - Date.now() : 0
      const state = v.status === 'active' && left <= 0 ? 'expired' : v.status
      const live = state === 'active'
      box.replaceChildren(
        h('div', { class: 'row' }, h('strong', {}, `임시 공간 서비스 (${service.hours}시간)`), h('span', { class: `badge ${state}` }, STATE[state] ?? state), h('span', { class: 'tag' }, `레이어 ${v.layer}`)),
        h('p', { class: 'small' }, `발행 ${local(v.publishedAt)} · 만료 ${local(v.expiresAt)}${live ? ` · 남은 시간 ${Math.floor(left / 3600000)}시간 ${Math.floor((left % 3600000) / 60000)}분` : ''}`),
        h('p', { class: `small ${live ? 'muted' : 'err'}` }, live
          ? `WMS·WFS 등 실제 응답·연동 확인용. 발행 완료 후 ${service.hours}시간 뒤 자동 만료되고 같은 URL은 더 쓸 수 없음 (연장 없음). 프로젝트에 계속 쓰려면 파일로 변환해 내려받기.`
          : '이용 기간이 끝난 서비스 — 이 URL로 데이터를 받을 수 없음. 파일로 변환하면 내려받아 계속 사용 가능.'),
        s.outputs.filter(o => o.service).map(o => outputBox({ ...o, available: o.available && live }, false)))
      if (live) setTimeout(() => { if (box.isConnected) draw() }, 60000)
    }
    draw()
    return box
  }

  function doneView(s) {
    const ok = !s.problems?.length
    const primary = s.primary
    const extras = s.outputs.filter(o => o !== primary && o.id !== primary?.id && !o.service)
    const live = s.delivery !== 'service' || s.service?.status === 'active'
    render(
      h('h2', {}, `${s.name} — ${ok ? '완료' : '결과 확인 필요'}`),
      h('p', { class: 'small muted' }, `${s.format} · ${s.method?.title ?? ''} · ${Math.round(s.progress.ms / 1000)}초${s.intent?.viewer ? ` · 대상 ${nameOf(s.intent.viewer)}` : ''}`),
      !ok && h('p', { class: 'small err' }, `변환은 끝났지만 결과가 약속과 다름: ${s.problems.join(' / ')} → 이 결과를 쓰지 말고 다른 방식으로 다시`),
      s.service ? serviceBox(s) : [
        // 최종본 형태 html: 바로 열리는 지도 폴더를 맨 앞에
        s.site && s.intent?.form === 'html' && h('div', { class: 'out main' },
          h('strong', {}, '독립 HTML 지도'),
          h('p', { class: 'small muted' }, '결과 + 지도 페이지(index.html) + 라이브러리를 한 폴더 zip으로. 정적 호스팅에 폴더째 올리면 그대로 열림 (안내는 README.txt)'),
          h('div', { class: 'row' }, h('button', { class: 'btn go sm', type: 'button', onclick: e => download({ download: s.site, file: `${s.name.replace(/[.][^.]*$/, '')}-map.zip`, zip: true }, e.currentTarget) }, 'HTML 지도 받기'), copyBtn('주소 복사', s.site))),
        primary && h('h3', {}, `${s.intent?.viewer ? `${nameOf(s.intent.viewer)}에서 쓸 ` : ''}주력 결과물`),
        primary && outputBox(primary, true),
        s.usages?.map(u => h('details', { open: !!s.intent?.viewer },
          h('summary', {}, `${u.name} 적용 방법 — ${u.api}`),
          h('pre', {}, u.code),
          h('div', { class: 'row' }, copyBtn('코드 복사', u.code),
            u.site && h('button', { class: 'btn sm', type: 'button', onclick: e => download({ download: u.site, file: `${s.name.replace(/[.][^.]*$/, '')}-${u.viewer}.zip`, zip: true }, e.currentTarget) }, '이 코드로 HTML 지도 받기'),
            h('span', { class: 'small muted' }, 'URL만 내려받아 올린 곳 주소로 바꾸면 그대로. 배경지도·웹 앱 구성은 직접')))),
      ],
      list('변환 기록 · 주의사항', s.limits, 'warn'),
      live && [
        h('p', { class: 'small muted' }, '아래 지도는 이 서버 결과로 그린 확인용 화면 (서버가 렌더링을 자동 검증하지는 않음)'),
        h('iframe', { src: `${s.view}&embed=1`, title: '결과 지도', allow: 'fullscreen' }),
        h('div', { class: 'row' }, linkBtn('지도 크게 보기', s.view), copyBtn('지도 주소 복사', s.view)),
      ],
      extras.length && h('details', {}, h('summary', {}, `추가 결과물 ${extras.length}개`), extras.map(o => outputBox(o, false))),
      h('p', { class: 'small muted' }, s.retention ?? ''),
      s.engine && engineCard(s.job),
      h('div', { class: 'row' }, againBtn(s), s.delivery === 'service' && againBtn(s, '파일로 다시 변환', { delivery: 'file' }), newFileBtn()))
    tell(`변환 ${ok ? '완료' : '결과 확인 필요'} (작업 ${s.job}, ${s.delivery === 'service' ? `서비스 ${s.service?.status}, 만료 ${s.service?.expiresAt}` : '파일'}). ${primary ? `주력 결과물 ${primary.label}: ${primary.url}${primary.download ? ` (내려받기 ${primary.download})` : ''}` : ''} 자세한 결과·적용 코드: geo_status({ job: "${s.job}" })`)
  }

  // ⑤ 엔진(Unreal) 실시간 보기 (geo_engine): 이 PC의 언리얼로 띄우고 Pixel Streaming 플레이어 주소. 준비되는 동안 5초마다 상태
  function engineCard(job, first) {
    const box = h('div', { class: 'out' })
    const head = h('div', { class: 'row' }, h('strong', {}, '언리얼 실시간 보기'), h('span', { class: 'tag' }, 'Cesium for Unreal · Pixel Streaming'))
    const call = args => tool('geo_engine', { job, ...args }).then(draw, e => draw({ state: 'off', log: e.message }))
    function draw(e) {
      if (!e || e.state === 'off') {
        first = null
        const go = h('button', { class: 'btn go sm', type: 'button', onclick: () => { go.disabled = true; go.textContent = '띄우는 중…'; call({}) } }, '언리얼로 띄우기')
        return box.replaceChildren(head,
          h('p', { class: 'small muted' }, '이 PC의 언리얼 엔진이 결과를 그리고, 그 화면을 영상으로 브라우저에 보냄. 이 PC·사내망에서만, 한 번에 하나, 보는 사람이 없으면 저절로 꺼짐.'),
          e?.log ? h('p', { class: 'small muted' }, `마지막 기록: ${e.log}`) : '',
          h('div', { class: 'row' }, go))
      }
      if (!first) tell(`사용자가 언리얼 실시간 보기를 띄움 (작업 ${job}). 플레이어: ${e.player}`)
      first = e
      box.replaceChildren(head,
        h('p', { class: e.state === 'ready' ? 'small' : 'small now' }, e.state === 'ready'
          ? `준비됨 · 보는 사람 ${e.viewers}명 · ${e.idleMin}분 동안 아무도 안 보면 꺼짐`
          : '언리얼이 장면을 불러오는 중 — 첫 실행은 셰이더 컴파일로 수 분. 플레이어를 먼저 열어 두어도 됨'),
        h('div', { class: 'row' }, h('code', {}, e.player), linkBtn('플레이어 열기', e.player), copyBtn('주소 복사', e.player)),
        h('div', { class: 'row' }, h('button', { class: 'btn sm', type: 'button', onclick: () => call({ stop: true }) }, '끄기')))
      if (e.state === 'starting') setTimeout(() => { if (box.isConnected && first === e) call({}) }, 5000)
    }
    draw(first)
    return box
  }

  // 호스트가 지도 화면(frame)을 막으면(Claude는 https 공개 주소만 허용) 빈 상자 대신 안내
  document.addEventListener('securitypolicyviolation', e => {
    if (!e.violatedDirective.startsWith('frame-src')) return
    document.querySelector('iframe')?.replaceWith(h('p', { class: 'small warn' },
      `이 대화 화면은 https 공개 주소의 지도만 띄울 수 있어 여기에는 지도를 못 보여 줌 (지금 주소 ${ORIGIN}). "지도 크게 보기" 또는 "지도 주소 복사"로 브라우저에서 보기.`))
  })

  function show(sc) {
    if (!sc) return
    if (sc.service?.deliveries) service = sc.service
    applyIntent(sc.intent)
    if (sc.mode === 'upload') uploadView()
    else if (sc.mode === 'choose') chooseView(sc)
    else if (sc.mode === 'engine') render(h('h2', {}, '언리얼 실시간 보기'), engineCard(sc.job, sc))
    else if (sc.job) progressView(sc)
  }

  // 핸들러는 connect 전에 (첫 알림을 놓치지 않게). 도구 입력의 조건은 결과보다 먼저 와서 화면을 그 조건으로 연다
  app.ontoolinput = p => { applyIntent(p?.arguments); render(h('p', { class: 'muted small' }, '처리 중…')) }
  app.ontoolresult = r => (r.isError ? render(h('p', { class: 'err' }, r.content?.[0]?.text ?? '도구 오류')) : show(r.structuredContent))
  await app.connect()
</script>
</body>
</html>
