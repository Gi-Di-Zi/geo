name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'deploy/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:lint
      - run: npm run test:reference-updates
      - name: Test offline address and code logic
        run: >-
          node --test
          tests/link/core.test.ts
          tests/link/reference.test.ts
          tests/link/administrative.test.ts
          tests/link/location.test.ts
          tests/link/location-resolve.test.ts
          tests/link/all.test.ts
          tests/link/boundary.test.ts
          tests/link/files.test.ts
          tests/link/jobs.test.ts
          tests/link/chunks.test.ts
      - run: npm run test:recommend
      - name: Test Linux upload worker isolation
        run: python3 tests/viz/upload-runner.test.py
      - run: npm run build
