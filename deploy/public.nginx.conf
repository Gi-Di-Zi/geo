limit_req_zone $binary_remote_addr zone=geo_mcp:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=geo_uploads:10m;
limit_req_zone $binary_remote_addr zone=geo_link:10m rate=5r/s;
server {
    listen 8080;
    server_name _;
    if ($host = geo.49.175.158.48.sslip.io) { return 308 https://geospatial.kro.kr$request_uri; }
    server_tokens off;
    # Geo 전용 Docker DNS의 앞단 Coolify 프록시만 신뢰한다.
    # 같은 네트워크의 앱이나 호스트가 보낸 X-Forwarded-For는 IP별 제한에 쓰지 않는다.
    set_real_ip_from coolify-proxy;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 201m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz {
        proxy_pass http://app:3000/;
        proxy_set_header Host $host;
    }
    location = /mcp {
        limit_req zone=geo_mcp burst=100 nodelay;
        limit_except GET POST DELETE OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location = /api/stage {
        limit_conn geo_uploads 2;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location = /api/jobs {
        limit_conn geo_uploads 2;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    # 업로드 화면이 서비스 발행 허용 여부를 묻는다 (공개 작업자는 파일만 → service: false). 막으면 브라우저에 403 오류가 남는다
    location = /api/jobs/capabilities {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    # 결과 파일·내려받기·독립 HTML 지도(site: 결과 + index.html + 라이브러리 zip)·결과 요약(info: QGIS 플러그인 등)
    location ~ "^/api/jobs/[0-9a-f-]{36}(?:/(?:files|download)/.*|/site|/info)?$" {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    # 주소·코드 연계: 즉시 변환·조회·경계만 작업자로 (일괄 작업·파일 업로드 경로는 아래 /api/에서 403).
    # 위치·우편번호·경계처럼 외부 원천(VWorld)을 부르는 행은 작업자가 접속자별 하루 한도로 센다
    location ~ ^/api/link/(?:resolve|boundary|references/update)$ {
        limit_req zone=geo_link burst=20 nodelay;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location ~ ^/api/link/(?:capabilities|regions|references)$ {
        limit_req zone=geo_link burst=20 nodelay;
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location ^~ /mcp/ { return 403; }
    location /api/ { return 403; }
    location /data/ {
        limit_except GET HEAD { deny all; }
        alias /public-data/;
        add_header X-Content-Type-Options nosniff always;
    }
    # OGC API Features는 QGIS 등 클라이언트가 시작 페이지 → 적합성 → 컬렉션 → items 순서로 찾아간다
    location ~ ^/svc/geoserver/(?:ows|wms|wfs|gwc/service/wmts|ogc/features/v1(?:/|/conformance|/collections/?|/collections/[a-zA-Z0-9_:.-]+(?:/items|/items/[a-zA-Z0-9_.-]+|/queryables)?)?)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/geoserver/(.*)$ /geoserver/geo/$1 break;
        proxy_pass http://host.docker.internal:18600;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # GeoServer는 능력 문서(GetCapabilities)에 내부 경로(http://<host>/geoserver/geo/…)를 적는다 → 공개 경로로 바꿔야
        # QGIS 같은 표준 클라이언트가 이어지는 요청(GetMap·GetFeature·GetTile)을 보낼 수 있다. 치환하려면 압축 없이 받는다
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/xml application/xml application/vnd.ogc.wms_xml application/json application/geo+json;
        sub_filter_once off;
        sub_filter "http://$host/geoserver/geo/" "https://$host/svc/geoserver/";
    }
    location ~ ^/svc/martin/[a-zA-Z0-9_.]+(?:/[0-9]+/[0-9]+/[0-9]+)?$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/martin/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:18601;
        proxy_set_header Host $host;
    }
    location /svc/ { return 403; }
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        # TLS는 앞단 Coolify 프록시가 끝낸다 → 앱이 만드는 절대 주소(QGIS plugins.xml 내려받기 등)는 https (작업자 프록시와 같게)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
