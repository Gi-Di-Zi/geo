limit_req_zone $binary_remote_addr zone=geo_mcp:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=geo_uploads:10m;
server {
    listen 8080;
    server_name _;
    if ($host = geo.49.175.158.48.sslip.io) { return 308 https://geospatial.kro.kr$request_uri; }
    server_tokens off;
    # 앞단 Coolify 프록시(TLS 종료)가 붙인 X-Forwarded-For에서 실제 접속자 IP를 복원한다.
    # 없으면 $binary_remote_addr가 프록시 주소 하나라 아래 IP별 제한이 사이트 전체 공용 제한이 된다
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 201m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz {
        proxy_pass http://app:3000/;
        proxy_set_header Host $host;
    }
    location = /mcp {
        limit_req zone=geo_mcp burst=100 nodelay;
        limit_except GET POST DELETE OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location = /api/stage {
        limit_conn geo_uploads 2;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location = /api/jobs {
        limit_conn geo_uploads 2;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    # 업로드 화면이 서비스 발행 허용 여부를 묻는다 (공개 작업자는 파일만 → service: false). 막으면 브라우저에 403 오류가 남는다
    location = /api/jobs/capabilities {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location ~ "^/api/jobs/[0-9a-f-]{36}(?:/(?:files|download)/.*)?$" {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/geo-worker-proxy.conf;
    }
    location ^~ /mcp/ { return 403; }
    location /api/ { return 403; }
    location /data/ {
        limit_except GET HEAD { deny all; }
        alias /public-data/;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/svc/geoserver/(?:ows|wms|wfs|ogc/features/v1/collections/[a-zA-Z0-9_:.-]+/items|gwc/service/wmts)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/geoserver/(.*)$ /geoserver/geo/$1 break;
        proxy_pass http://host.docker.internal:18600;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location ~ ^/svc/martin/[a-zA-Z0-9_.]+(?:/[0-9]+/[0-9]+/[0-9]+)?$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/martin/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:18601;
        proxy_set_header Host $host;
    }
    location /svc/ { return 403; }
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
