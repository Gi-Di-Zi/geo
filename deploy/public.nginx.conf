server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz {
        proxy_pass http://app:3000/;
        proxy_set_header Host $host;
    }
    location = /mcp { return 403; }
    location ^~ /mcp/ { return 403; }
    location ^~ /api/ { return 403; }
    location /data/ {
        limit_except GET HEAD { deny all; }
        alias /public-data/;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ ^/svc/geoserver/(?:ows|wms|wfs|ogc/features/v1/collections/[a-zA-Z0-9_:.-]+/items|gwc/service/wmts)$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/geoserver/(.*)$ /geoserver/geo/$1 break;
        proxy_pass http://host.docker.internal:18600;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location ~ ^/svc/martin/[a-zA-Z0-9_.]+(?:/[0-9]+/[0-9]+/[0-9]+)?$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/svc/martin/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:18601;
        proxy_set_header Host $host;
    }
    location /svc/ { return 403; }
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
